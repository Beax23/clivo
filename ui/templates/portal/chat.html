    function render(briefing) {
        chatInner.innerHTML = '';

        var wsName = briefing.workspace_name || 'Escritório';
        titleEl.textContent = wsName;
        setAvatar(avatarEl, briefing);

        var total = briefing.progress ? (briefing.progress.total_required || 0) : 0;
        var done = briefing.progress ? (briefing.progress.answered || 0) : 0;
        var pct = total > 0 ? Math.round((done / total) * 100) : 0;

        progressFill.style.width = pct + '%';
        progressText.textContent = pct + '%';

        var statusKey = briefing.portal_status || 'in_progress';
        var sm = STATUS_MAP[statusKey] || STATUS_MAP.in_progress;

        if (sm.done) {
            progressFill.classList.add('is-done');
            dotEl.className = 'h-sub-dot';
        } else {
            progressFill.classList.remove('is-done');
            dotEl.className = 'h-sub-dot ' + (sm.dot || '');
        }

        if (statusKey === 'completed') subEl.textContent = 'Concluído';
        else if (statusKey === 'paused') subEl.textContent = 'Pausado';
        else if (statusKey === 'cancelled') subEl.textContent = 'Cancelado';
        else if (statusKey === 'not_started') subEl.textContent = 'Aguardando você começar';
        else if (statusKey === 'reopened') subEl.textContent = 'Reaberto';
        else subEl.textContent = done + ' de ' + total + ' respondidas';

        if (briefing.show_intro) {
            renderIntro(briefing);
            return;
        }

        (briefing.sections || []).forEach(function (s) {
            (s.questions || []).forEach(function (q) {
                var isAns = q.state === 'answered' ||
                            q.state === 'pending_clarification' ||
                            q.state === 'review_requested';
                var isCur = String(q.id) === String(briefing.next_question_id);
                if (!isAns && !isCur) return;
                renderTurn(briefing, q);
            });
        });

        if (statusKey === 'completed') {
            var d = document.createElement('div');
            d.className = 'done';
            d.innerHTML =
                '<div class="done-badge">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' +
                '</div>' +
                '<h2>Briefing concluído</h2>' +
                '<p>Obrigada(o) por compartilhar seus desejos. Já estamos trabalhando neles!</p>';

            var pageUrl = briefing.briefing_page_url || '';
            var pdfUrl = briefing.briefing_pdf_url || '';

            var actions = document.createElement('div');
            actions.className = 'done-actions';

            if (pageUrl) {
                var ctaPage = document.createElement('a');
                ctaPage.href = pageUrl;
                ctaPage.className = 'done-cta is-primary';
                ctaPage.innerHTML =
                    'Ver respostas' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">' +
                        '<line x1="5" y1="12" x2="19" y2="12"/>' +
                        '<polyline points="12 5 19 12 12 19"/>' +
                    '</svg>';
                actions.appendChild(ctaPage);
            }

            if (pdfUrl) {
                var ctaPdf = document.createElement('a');
                ctaPdf.href = pdfUrl;
                ctaPdf.className = 'done-cta';
                ctaPdf.target = '_blank';
                ctaPdf.rel = 'noopener';
                ctaPdf.innerHTML =
                    'Exportar PDF' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">' +
                        '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>' +
                        '<polyline points="7 10 12 15 17 10"/>' +
                        '<line x1="12" y1="15" x2="12" y2="3"/>' +
                    '</svg>';
                actions.appendChild(ctaPdf);
            }

            if (actions.childElementCount > 0) {
                d.appendChild(actions);
            }

            chatInner.appendChild(d);
            composer.style.display = 'none';
            scrollToBottom();
            return;
        }

        if (briefing.can_answer === false) {
            var explain;
            if (statusKey === 'paused') explain = 'Seu arquiteto pausou este briefing.';
            else if (statusKey === 'cancelled') explain = 'Este briefing foi cancelado.';
            else explain = 'Este briefing não está mais aceitando respostas.';

            var b = document.createElement('div');
            b.className = 'done';
            b.innerHTML =
                '<div class="done-badge" style="background:var(--bg-secondary);color:var(--text-2);box-shadow:none;">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
                '</div>' +
                '<h2>' + esc(sm.label) + '</h2>' +
                '<p>' + esc(explain) + '</p>';
            chatInner.appendChild(b);
            composer.style.display = 'none';
            scrollToBottom();
            return;
        }

        var nextQid = briefing.next_question_id;
        if (nextQid) {
            var q = findQuestion(briefing, nextQid);
            if (q && isChoice(q)) {
                composer.style.display = 'none';
                currentQuestionId = nextQid;
            } else if (q) {
                composer.style.display = '';
                currentQuestionId = nextQid;
                setTimeout(function () {
                    if (window.matchMedia('(min-width: 1024px)').matches) input.focus();
                }, 150);
            }
        } else {
            composer.style.display = 'none';
            currentQuestionId = null;
        }

        scrollToBottom();
    }

    async function load() {
        try {
            var briefing = await api('/api/portal/briefings/' + briefingId + '/');
            currentBriefing = briefing;
            skeleton.style.display = 'none';
            chatInner.style.display = 'flex';
            render(briefing);
        } catch (err) {
            console.error(err);
            if (err.status === 401) { window.location.href = '/portal/'; return; }
            skeleton.style.display = 'none';
            document.getElementById('cErrorTitle').textContent = 'Erro';
            document.getElementById('cErrorMessage').textContent = 'Não foi possível abrir este briefing.';
            errorEl.classList.add('is-active');
        }
    }

    async function submitText() {
        var t = input.value.trim();
        if (!t || sending || !currentQuestionId) return;
        await sendPayload({ text: t }, t);
    }

    async function sendPayload(payload, opt) {
        if (sending || !currentQuestionId) return;
        sending = true;
        sendBtn.disabled = true;
        sendBtn.classList.add('is-loading');
        input.disabled = true;
        micBtn.disabled = true;

        var last = chatInner.querySelector('.turn:last-child');
        if (last) {
            var o = document.createElement('div');
            o.className = 'bubble-out';
            o.innerHTML = '<div class="bubble-out-inner is-pending">' +
                esc(opt) + '<span class="out-meta">' + nowTime() + '</span></div>';
            last.appendChild(o);
        }

        input.value = '';
        input.style.height = 'auto';
        scrollToBottom(true);

        try {
            await api(
                '/api/portal/briefings/' + briefingId + '/questions/' + currentQuestionId + '/answer/',
                { method: 'POST', body: payload }
            );
            await load();
        } catch (err) {
            console.error(err);
            var p = chatInner.querySelector('.bubble-out-inner.is-pending');
            if (p) p.closest('.bubble-out').remove();
            input.value = opt || '';
            showToast(err.message || 'Erro ao enviar.');
        } finally {
            sending = false;
            sendBtn.classList.remove('is-loading');
            sendBtn.disabled = !input.value.trim();
            input.disabled = false;
            micBtn.disabled = false;
            if (window.matchMedia('(min-width: 1024px)').matches) input.focus();
        }
    }

    function pickMime() {
        var c = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus', 'audio/ogg'];
        for (var i = 0; i < c.length; i++) {
            if (window.MediaRecorder && MediaRecorder.isTypeSupported(c[i])) return c[i];
        }
        return '';
    }

    async function askMic() {
        try {
            micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            return true;
        } catch (err) {
            console.error(err);
            if (err && (err.name === 'NotAllowedError' || err.name === 'SecurityError'))
                showToast('Permissão de microfone negada.');
            else if (err && err.name === 'NotFoundError')
                showToast('Nenhum microfone encontrado.');
            else
                showToast('Não foi possível acessar o microfone.');
            return false;
        }
    }

    async function startRec() {
        if (!navigator.mediaDevices || !window.MediaRecorder) {
            showToast('Navegador sem suporte a gravação.');
            return;
        }
        if (!micStream) {
            var ok = await askMic();
            if (!ok) return;
        }
        recordedChunks = [];
        var m = pickMime();
        var opts = m ? { mimeType: m } : {};
        try {
            mediaRecorder = new MediaRecorder(micStream, opts);
        } catch (err) {
            console.error(err);
            showToast('Erro ao gravar.');
            stopStream();
            return;
        }
        mediaRecorder.addEventListener('dataavailable', function (e) {
            if (e.data && e.data.size > 0) recordedChunks.push(e.data);
        });
        mediaRecorder.addEventListener('stop', function () {
            var b = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
            recordedBlob = b;
            if (recordingUrl) URL.revokeObjectURL(recordingUrl);
            recordingUrl = URL.createObjectURL(b);
            recSend.disabled = false;
            recHint.textContent = 'Áudio pronto.';
        });
        mediaRecorder.start();
        recordingStartTime = Date.now();
        micBtn.classList.add('is-recording');
        recBar.classList.add('is-active');
        recSend.disabled = true;
        recHint.textContent = 'Gravando…';
        if (recordingTimer) clearInterval(recordingTimer);
        recordingTimer = setInterval(function () {
            var s = Math.floor((Date.now() - recordingStartTime) / 1000);
            recTime.textContent = formatDuration(s);
        }, 250);
    }

    function stopRec() {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            try { mediaRecorder.stop(); } catch (_) {}
        }
        stopStream();
        micBtn.classList.remove('is-recording');
        if (recordingTimer) { clearInterval(recordingTimer); recordingTimer = null; }
    }

    function cancelRec() {
        stopRec();
        recBar.classList.remove('is-active');
        recordedBlob = null;
        recordedChunks = [];
        if (recordingUrl) { URL.revokeObjectURL(recordingUrl); recordingUrl = null; }
        recSend.disabled = true;
        recTime.textContent = '0:00';
    }

    function stopStream() {
        if (micStream) {
            micStream.getTracks().forEach(function (t) { try { t.stop(); } catch (_) {} });
            micStream = null;
        }
    }

    async function uploadAudio(blob) {
        var ext = 'webm';
        if (blob.type.indexOf('mp4') >= 0) ext = 'm4a';
        else if (blob.type.indexOf('ogg') >= 0) ext = 'ogg';
        var file = new File([blob], 'audio.' + ext, { type: blob.type || 'audio/webm' });
        var fd = new FormData();
        fd.append('file', file);
        fd.append('kind', 'audio');
        var res = await fetch('/api/documents/', {
            method: 'POST',
            credentials: 'include',
            headers: {
                'X-CSRFToken': getCookie('csrftoken'),
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: fd
        });
        var data = null;
        try { data = await res.json(); } catch (_) {}
        if (!res.ok || !data || !data.id) throw new Error('Falha ao enviar áudio.');
        return data.id;
    }

    async function sendRec() {
        if (!recordedBlob || sending) return;
        recSend.disabled = true;
        recHint.textContent = 'Enviando…';
        try {
            var id = await uploadAudio(recordedBlob);
            cancelRec();
            await sendPayload({ audio_document_id: id, text: '' }, '[Áudio]');
        } catch (err) {
            console.error(err);
            showToast(err.message || 'Erro ao enviar.');
            recSend.disabled = false;
            recHint.textContent = 'Falha. Tente novamente.';
        }
    }

    function autosize() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 140) + 'px';
    }

    input.addEventListener('input', function () {
        autosize();
        sendBtn.disabled = !input.value.trim() || sending;
    });
    input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitText(); }
    });
    sendBtn.addEventListener('click', submitText);

    micBtn.addEventListener('click', async function () {
        if (sending) return;
        if (mediaRecorder && mediaRecorder.state === 'recording') { stopRec(); return; }
        recordedBlob = null;
        recordedChunks = [];
        if (recordingUrl) { URL.revokeObjectURL(recordingUrl); recordingUrl = null; }
        await startRec();
    });

    recCancel.addEventListener('click', cancelRec);
    recSend.addEventListener('click', function () {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            stopRec();
            var t = setInterval(function () {
                if (recordedBlob) { clearInterval(t); sendRec(); }
            }, 100);
        } else if (recordedBlob) {
            sendRec();
        }
    });

    chatEl.addEventListener('scroll', function () {
        var d = chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight;
        userScrolledUp = d > 100;
    });

    load();
})();
</script>
