{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Meus briefings · Clivo</title>
    <meta name="csrf-token" content="{{ csrf_token }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg: #FFFFFF;
            --bg-soft: #F7F7F9;
            --border: #E9E9EC;
            --text: #101014;
            --text-soft: #6B6B76;
            --text-mute: #9797A1;
            --green: #17B26A;
            --radius: 12px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        [data-theme="dark"] {
            --bg: #0A0A0A;
            --bg-soft: #141414;
            --border: #1F1F1F;
            --text: #F5F5F5;
            --text-soft: #A0A0A0;
            --text-mute: #666666;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .p-header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .p-logo {
            width: 26px; height: 26px; border-radius: 6px;
            background: var(--text); color: var(--bg);
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 700;
        }
        .p-name { font-size: 13px; font-weight: 600; flex: 1; }
        .p-logout {
            font-size: 12px;
            color: var(--text-soft);
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            transition: background-color 140ms ease;
        }
        .p-logout:hover { background: var(--bg-soft); color: var(--text); }

        .p-main {
            flex: 1;
            padding: 32px 22px 60px;
            max-width: 640px;
            width: 100%;
            margin: 0 auto;
        }

        .p-page-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.4px;
            margin-bottom: 6px;
        }
        .p-page-sub {
            font-size: 13.5px;
            color: var(--text-soft);
            margin-bottom: 24px;
        }

        .p-state {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 12px;
            padding: 50px 20px;
        }
        .p-state.is-active { display: flex; }
        .p-state-icon {
            width: 46px; height: 46px;
            border-radius: 50%;
            background: var(--bg-soft);
            color: var(--text-soft);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .p-state h2 { font-size: 16px; font-weight: 700; }
        .p-state p {
            font-size: 13px;
            color: var(--text-soft);
            max-width: 340px;
            line-height: 1.55;
        }
        .p-spinner {
            width: 22px; height: 22px;
            border: 2px solid var(--border);
            border-top-color: var(--text);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .p-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .p-card {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: border-color 140ms ease, background-color 140ms ease;
            background: var(--bg);
            text-decoration: none;
            color: inherit;
        }
        .p-card:hover {
            border-color: var(--text-mute);
            background: var(--bg-soft);
        }
        .p-card-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .p-card-title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .p-card-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-soft);
        }
        .p-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 999px;
            background: var(--bg-soft);
            border: 1px solid var(--border);
            color: var(--text-soft);
        }
        .p-badge.is-done {
            color: var(--green);
            border-color: var(--green);
            background: transparent;
        }
        .p-card-arrow {
            color: var(--text-mute);
            font-size: 14px;
            flex-shrink: 0;
        }

        .p-progress {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-mute);
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>

<header class="p-header">
    <div class="p-logo">C</div>
    <div class="p-name" id="pClientName">…</div>
    <button class="p-logout" id="pLogout" type="button">Sair</button>
</header>

<main class="p-main">
    <h1 class="p-page-title">Meus briefings</h1>
    <p class="p-page-sub">Responda quando puder — você pode voltar depois.</p>

    <div class="p-state is-active" id="pStateLoading">
        <div class="p-spinner"></div>
    </div>

    <div class="p-state" id="pStateError">
        <div class="p-state-icon"><i class="fas fa-exclamation-triangle"></i></div>
        <h2 id="pErrorTitle">Erro</h2>
        <p id="pErrorMessage"></p>
    </div>

    <div class="p-state" id="pStateEmpty">
        <div class="p-state-icon"><i class="fas fa-inbox"></i></div>
        <h2>Nada por aqui ainda</h2>
        <p>Assim que seu arquiteto enviar um briefing, ele aparecerá nesta lista.</p>
    </div>

    <div class="p-list" id="pList" style="display:none;"></div>
</main>

<script>
(function () {
    'use strict';

    const nameEl = document.getElementById('pClientName');
    const stateLoading = document.getElementById('pStateLoading');
    const stateError = document.getElementById('pStateError');
    const stateEmpty = document.getElementById('pStateEmpty');
    const listEl = document.getElementById('pList');

    function showState(id) {
        [stateLoading, stateError, stateEmpty].forEach(el => {
            el.classList.toggle('is-active', el.id === id);
        });
        listEl.style.display = (id === null) ? 'flex' : 'none';
    }

    function getCookie(name) {
        const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
        return v ? v.pop() : '';
    }

    async function api(url, options = {}) {
        const opts = {
            method: options.method || 'GET',
            credentials: 'include',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken'),
                'X-Requested-With': 'XMLHttpRequest',
            },
        };
        if (options.body) opts.body = JSON.stringify(options.body);
        const res = await fetch(url, opts);
        let data = null;
        try { data = await res.json(); } catch (_) {}
        if (!res.ok) {
            const err = new Error((data && (data.error || data.detail)) || `Erro ${res.status}`);
            err.status = res.status;
            throw err;
        }
        return data;
    }

    function escapeHtml(str) {
        if (str == null) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function renderList(briefings) {
        listEl.innerHTML = '';
        if (!briefings.length) {
            showState('pStateEmpty');
            return;
        }
        showState(null);

        briefings.forEach(b => {
            const progress = b.progress || { answered: 0, total_required: 0 };
            const total = progress.total_required || 0;
            const done = progress.answered || 0;
            const isDone = b.status === 'completed';

            const card = document.createElement('a');
            card.className = 'p-card';
            card.href = `/portal/briefings/${b.id}/`;
            card.innerHTML = `
                <div class="p-card-info">
                    <div class="p-card-title">${escapeHtml(b.title || 'Briefing')}</div>
                    <div class="p-card-meta">
                        <span class="p-badge ${isDone ? 'is-done' : ''}">
                            ${isDone ? '✓ Concluído' : 'Em andamento'}
                        </span>
                        ${total ? `<span class="p-progress">${done}/${total}</span>` : ''}
                    </div>
                </div>
                <i class="fas fa-chevron-right p-card-arrow"></i>
            `;
            listEl.appendChild(card);
        });
    }

    async function boot() {
        try {
            const me = await api('/api/portal/me/');
            nameEl.textContent = me.name || 'Cliente';
        } catch (err) {
            window.location.href = '/portal/';
            return;
        }

        try {
            const briefings = await api('/api/portal/briefings/');
            const list = Array.isArray(briefings) ? briefings : (briefings.results || []);
            renderList(list);
        } catch (err) {
            console.error(err);
            document.getElementById('pErrorTitle').textContent = 'Erro ao carregar';
            document.getElementById('pErrorMessage').textContent =
                'Não foi possível carregar seus briefings.';
            showState('pStateError');
        }
    }

    document.getElementById('pLogout').addEventListener('click', async () => {
        try {
            await api('/api/portal/logout/', { method: 'POST' });
        } catch (_) {}
        window.location.href = '/portal/';
    });

    boot();
})();
</script>

</body>
</html>
