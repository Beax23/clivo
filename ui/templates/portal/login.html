{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Entrar · Clivo</title>
    <meta name="csrf-token" content="{{ csrf_token }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #FFFFFF;
            --bg-soft: #F7F7F9;
            --border: #E9E9EC;
            --text: #101014;
            --text-soft: #6B6B76;
            --text-mute: #9797A1;
            --danger: #E5484D;
            --danger-bg: #FDECEC;
            --radius: 12px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        [data-theme="dark"] {
            --bg: #0A0A0A;
            --bg-soft: #141414;
            --border: #1F1F1F;
            --text: #F5F5F5;
            --text-soft: #A0A0A0;
            --text-mute: #666666;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .p-header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .p-logo {
            width: 26px; height: 26px; border-radius: 6px;
            background: var(--text); color: var(--bg);
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 700;
        }
        .p-name { font-size: 13px; font-weight: 600; }

        .p-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .p-card {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .p-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.4px;
            text-align: center;
        }
        .p-sub {
            font-size: 13.5px;
            color: var(--text-soft);
            text-align: center;
            line-height: 1.55;
        }

        .p-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .p-field label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-soft);
        }
        .p-field input {
            width: 100%;
            height: 52px;
            padding: 0 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-soft);
            color: var(--text);
            font-size: 17px;
            font-family: var(--font);
            font-weight: 600;
            letter-spacing: 0.12em;
            text-align: center;
            text-transform: uppercase;
            outline: none;
            transition: border-color 140ms ease, background-color 140ms ease;
        }
        .p-field input:focus {
            background: var(--bg);
            border-color: var(--text);
        }
        .p-field input::placeholder {
            color: var(--text-mute);
            letter-spacing: 0.08em;
            text-transform: none;
            font-weight: 400;
        }

        .p-btn {
            height: 48px;
            border: none;
            border-radius: var(--radius);
            background: var(--text);
            color: var(--bg);
            font-size: 14px;
            font-weight: 600;
            font-family: var(--font);
            cursor: pointer;
            transition: opacity 140ms ease;
        }
        .p-btn:hover:not(:disabled) { opacity: 0.88; }
        .p-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .p-error {
            padding: 10px 14px;
            border-radius: 10px;
            background: var(--danger-bg);
            color: var(--danger);
            font-size: 12.5px;
            font-weight: 500;
            line-height: 1.4;
            display: none;
        }
        .p-error.is-visible { display: block; }

        .p-footer {
            padding: 18px 22px;
            text-align: center;
            font-size: 11px;
            color: var(--text-mute);
        }
    </style>
</head>
<body>

<header class="p-header">
    <div class="p-logo">C</div>
    <div class="p-name">Clivo</div>
</header>

<main class="p-main">
    <div class="p-card">
        <div>
            <h1 class="p-title">Bem-vindo</h1>
            <p class="p-sub">Digite o código que você recebeu para acessar seus briefings.</p>
        </div>

        <form id="pLoginForm">
            <div class="p-field">
                <label for="pCode">Código de acesso</label>
                <input
                    type="text"
                    id="pCode"
                    name="code"
                    placeholder="CLI-XXXXXX"
                    autocomplete="off"
                    autocapitalize="characters"
                    spellcheck="false"
                    maxlength="20"
                    required
                >
            </div>

            <div class="p-error" id="pError"></div>

            <div style="margin-top: 16px;">
                <button type="submit" class="p-btn" id="pSubmit">Entrar</button>
            </div>
        </form>
    </div>
</main>

<footer class="p-footer">
    Um espaço seguro para o seu projeto.
</footer>

<script>
(function () {
    'use strict';

    const form = document.getElementById('pLoginForm');
    const input = document.getElementById('pCode');
    const submit = document.getElementById('pSubmit');
    const errorBox = document.getElementById('pError');

    function getCookie(name) {
        const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
        return v ? v.pop() : '';
    }

    function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.add('is-visible');
    }
    function clearError() {
        errorBox.textContent = '';
        errorBox.classList.remove('is-visible');
    }

    // Formata o input: deixa maiúsculo e adiciona prefixo CLI-
    input.addEventListener('input', () => {
        let v = input.value.toUpperCase().replace(/[^A-Z0-9-]/g, '');
        if (v && !v.startsWith('CLI-')) {
            v = 'CLI-' + v.replace(/^CLI-?/, '');
        }
        input.value = v;
        clearError();
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const code = input.value.trim();
        if (!code) return;

        submit.disabled = true;
        submit.textContent = 'Entrando…';
        clearError();

        try {
            const res = await fetch('/api/portal/login/', {
                method: 'POST',
                credentials: 'include',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken'),
                    'X-Requested-With': 'XMLHttpRequest',
                },
                body: JSON.stringify({ code }),
            });

            let data = null;
            try { data = await res.json(); } catch (_) {}

            if (!res.ok) {
                showError((data && data.error) || 'Não foi possível entrar.');
                submit.disabled = false;
                submit.textContent = 'Entrar';
                return;
            }

            window.location.href = '/portal/home/';
        } catch (err) {
            console.error(err);
            showError('Erro de conexão. Tente novamente.');
            submit.disabled = false;
            submit.textContent = 'Entrar';
        }
    });

    input.focus();
})();
</script>

</body>
</html>
