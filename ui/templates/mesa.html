{% extends "sidebar.html" %}
{% load static %}

{% block title %}Mesa · Clivo{% endblock %}
{% block page_name %}mesa{% endblock %}

{% block page_css %}
<link rel="stylesheet" href="{% static 'css/mesa.css' %}">
{% endblock %}

{% block content %}
<div class="rf-page" id="msPage">
    <div class="rf-body">

        <section class="rf-main" id="msMain">

            <header class="rf-header">
                <div class="rf-header-left">
                    <div class="rf-header-title-row">
                        <h1>Mesa</h1>
                        <span class="rf-header-dot" aria-hidden="true">·</span>
                        <p class="rf-header-sub">O que precisa de mim agora?</p>
                    </div>
                </div>
            </header>

            <div class="rf-scroll" id="msScroll">
                <div class="rf-list-empty">
                    <i data-lucide="layout-list"></i>
                    <p>Em breve.</p>
                </div>
            </div>

        </section>

    </div>
</div>
{% endblock %}

{% block page_js %}
<script src="{% static 'js/mesa.js' %}"></script>
{% endblock %}
