{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Clivo">
    <title>Convite inválido · Clivo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-page: #FFFFFF;
            --bg-secondary: #F7F7F9;
            --border-color: #E9E9EC;
            --text-primary: #101014;
            --text-secondary: #6B6B76;
            --text-tertiary: #9797A1;
            --blue: #4A6CF7;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-xl: 18px;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-family);
            background: var(--bg-page);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .container {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
        }

        .card {
            width: 100%;
            max-width: 440px;
            text-align: center;
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: var(--text-primary);
            margin-bottom: 48px;
        }

        .icon-wrap {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--bg-secondary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            color: var(--text-tertiary);
            font-size: 30px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        p {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 44px;
            padding: 0 20px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 600;
            font-family: var(--font-family);
            text-decoration: none;
            cursor: pointer;
            border: 1px solid transparent;
            transition: opacity 150ms ease-out, background-color 150ms ease-out;
        }

        .btn-primary {
            background: var(--text-primary);
            color: #FFFFFF;
        }

        .btn-primary:hover {
            opacity: 0.85;
        }

        .btn-ghost {
            background: transparent;
            border-color: var(--border-color);
            color: var(--text-primary);
        }

        .btn-ghost:hover {
            background: var(--bg-secondary);
        }

        .footer {
            margin-top: 40px;
            font-size: 11px;
            color: var(--text-tertiary);
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">

            <div class="logo">Clivo</div>

            <div class="icon-wrap">
                <i class="fas fa-link-slash"></i>
            </div>

            <h1>Convite inválido</h1>

            <p>
                Este convite não existe, expirou ou já foi utilizado.<br>
                Peça a quem te convidou para enviar novamente.
            </p>

            <div class="actions">
                <a href="/login/" class="btn btn-primary">
                    <i class="fas fa-arrow-right-to-bracket"></i>
                    <span>Ir para o login</span>
                </a>
                <a href="/" class="btn btn-ghost">
                    <span>Voltar para a página inicial</span>
                </a>
            </div>

            <div class="footer">
                Clivo · Do briefing à entrega das chaves,<br>reunido em um só lugar.
            </div>

        </div>
    </div>

</body>
</html>
